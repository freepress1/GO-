<!DOCTYPE html>
<html>
<head>
  <title>Radio Player</title>
  <style>
    body {
      margin: 0;
      background: transparent;
    }
    .audio-slim {
      padding: 0;
      margin: 0;
      background: transparent;
    }
    audio {
      width: 100%;
      display: block;
    }
    .volume-slider {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="audio-slim">
    <audio id="audio" controls>
      <source src="https://stream.zeno.fm/e1yf9avqgbjvv" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <!-- Volume Control Slider -->
    <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="1">
  </div>

  <script>
    const audio = document.getElementById('audio');
    const volumeControl = document.getElementById('volumeControl');

    // Set initial volume (in case the player is already loaded)
    audio.volume = volumeControl.value;

    // Update the audio volume based on the slider
    volumeControl.addEventListener('input', function() {
      audio.volume = volumeControl.value;
    });
  </script>
</body>
</html>
