<!DOCTYPE html>
<html>
<head>
  <title>Radio Player</title>
  <style>
    body {
      margin: 0;
      background: transparent;
    }
    .audio-slim {
      padding: 0;
      margin: 0;
      background: transparent;
    }
    audio {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="audio-slim">
    <audio id="audio" controls>
      <source src="https://stream.zeno.fm/e1yf9avqgbjvv" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>
</body>
</html>
